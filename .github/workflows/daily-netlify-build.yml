name: Daily Netlify Product Sync

on:
  schedule:
    # 06:10 Asia/Shanghai. GitHub cron uses UTC.
    - cron: "10 22 * * *"
  workflow_dispatch:

jobs:
  trigger-netlify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        run: |
          curl --fail --silent --show-error --request POST "$NETLIFY_DAILY_BUILD_HOOK_URL"
        env:
          NETLIFY_DAILY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_DAILY_BUILD_HOOK_URL }}
